name: "izBoard"
version: "0.4.1"
slug: "izboard"
description: "izBoard E-Paper Dashboard for Home Assistant"
url: "https://github.com/izdev-digital/hass-add-ons"
# Prebuilt in https://github.com/izdev-digital/e-paper-dashboard; tag must match version
image: "izdevdigital/izboard-addon"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8128
watchdog: "tcp://[HOST]:[PORT:8128]"
ingress_entry: /
panel_icon: mdi:tablet-dashboard
panel_title: izBoard
map:
  - data:rw
tmpfs: true
apparmor: true
homeassistant_api: true
ports:
  8129/tcp: 8129
ports_description:
  8129/tcp: "Device communication (pairing, rendering, configuration)"
options:
  CLIENT_URL: "http://homeassistant.local:8129"
schema:
  CLIENT_URL: url
environment:
  APP_MODE: "Addon"
  ASPNETCORE_URLS: "http://0.0.0.0:8128;http://0.0.0.0:8129"

breaking_versions:
  - "0.4.0"