name: "izBoard"
version: "0.8.2"
slug: "izboard"
description: "izBoard E-Paper Dashboard for Home Assistant"
url: "https://github.com/beetnode/hass-add-ons"
# Prebuilt in https://github.com/beetnode/izBoard; tag must match version
image: "izdevdigital/izboard-addon"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8128
watchdog: "tcp://[HOST]:[PORT:8128]"
ingress_entry: /
panel_icon: mdi:tablet-dashboard
panel_title: izBoard
# Every ingress user is signed into izBoard as its shared superuser, so keep the
# panel admin-only. This is the Supervisor default; set explicitly to pin intent.
panel_admin: true
map:
  - data:rw
tmpfs: true
apparmor: true
homeassistant_api: true
ports:
  8129/tcp: 8129
ports_description:
  8129/tcp: "Device communication over TLS (pairing, rendering, configuration)"
options:
  # Only the host is used: displays connect to it on the device port (8129)
  CLIENT_URL: "http://homeassistant.local:8128"
schema:
  CLIENT_URL: url
environment:
  APP_MODE: "Addon"

breaking_versions:
  - "0.4.0"
  # Device port is TLS-only; displays must be paired again
  - "0.8.0"
